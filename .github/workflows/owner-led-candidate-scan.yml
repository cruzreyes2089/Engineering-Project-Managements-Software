name: Owner-led fresh candidate static scan
# Hosted Defender availability is not guaranteed; manual qualification only.
# The same script is used on an owner-controlled isolated Windows machine.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify and scan fresh candidate (no launch or upload)
        shell: pwsh
        run: ./tools/security/Invoke-CandidateStaticScan.ps1 -ExpectedCommit $env:GITHUB_SHA
